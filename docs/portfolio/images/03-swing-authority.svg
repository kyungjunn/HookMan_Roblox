  <text x="190" y="370" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="24" font-weight="800">카메라 시선 / A·D</text>
  <text x="190" y="404" text-anchor="middle" fill="#A8C4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">속도 크기 보존 회전 조향</text>

  <rect x="380" y="324" width="460" height="108" rx="16" fill="#3A2448"/>
