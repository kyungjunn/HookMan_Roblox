  <line x1="840" y1="516" x2="880" y2="516" stroke="#8AA0BB" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="1300" y1="516" x2="1340" y2="516" stroke="#6EE7A8" stroke-width="3" marker-end="url(#a3g)"/>

  <rect x="380" y="600" width="460" height="108" rx="16" fill="#101820" stroke="#3A5A78" stroke-width="2"/>
  <text x="610" y="642" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">HookmanVerdict 수신 후에만 콤보 HUD 확정</text>
  <text x="610" y="676" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">거절된 attach는 로프 정리 + 강제 release</text>

  <rect x="880" y="600" width="420" height="108" rx="16" fill="#1E5538"/>
  <text x="1090" y="642" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">RewardRules.judge</text>
  <text x="1090" y="676" text-anchor="middle" fill="#B8DCC8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">등급 × 콤보 × 장비 × 존 배수</text>

  <rect x="1340" y="600" width="220" height="108" rx="16" fill="#3A3418"/>
  <text x="1450" y="644" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">run.score</text>
  <text x="1450" y="676" text-anchor="middle" fill="#C8B878" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="17">훅당 1회만 award</text>

  <line x1="840" y1="654" x2="880" y2="654" stroke="#8AA0BB" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="1300" y1="654" x2="1340" y2="654" stroke="#6EE7A8" stroke-width="3" marker-end="url(#a3g)"/>

  <rect x="40" y="732" width="1520" height="176" rx="18" fill="#17202C" stroke="#2E4A66" stroke-width="2"/>
  <text x="68" y="776" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">판정 창  (최하점이 아니라 상승각)</text>
  <text x="68" y="812" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">최하점 릴리즈는 수평 속도만 주고 고도를 잃는다. 목표 phi = +30°. 남은 시간 t의 절대값으로 등급.</text>

  <rect x="68" y="832" width="250" height="56" rx="12" fill="#4A3A10" stroke="#FFD640" stroke-width="2"/>
  <text x="193" y="868" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">PERFECT  ≤ 0.08s</text>
  <rect x="334" y="832" width="250" height="56" rx="12" fill="#143820" stroke="#6EE7A8" stroke-width="2"/>
  <text x="459" y="868" text-anchor="middle" fill="#6EE7A8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">GREAT  ≤ 0.20s</text>
  <rect x="600" y="832" width="250" height="56" rx="12" fill="#1E3348" stroke="#8AA0BB" stroke-width="2"/>
  <text x="725" y="868" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">GOOD  ≤ 0.40s</text>
  <rect x="866" y="832" width="250" height="56" rx="12" fill="#3A1818" stroke="#FF6B6B" stroke-width="2"/>
  <text x="991" y="868" text-anchor="middle" fill="#FF8A8A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">MISS  &gt; 0.40s</text>
  <text x="1148" y="854" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">PERFECT/GREAT → 콤보 +1</text>
  <text x="1148" y="880" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">MISS → 콤보 0    GOOD → 유지</text>

  <rect x="40" y="928" width="1520" height="180" rx="18" fill="#1A1410" stroke="#664428" stroke-width="2"/>
  <text x="68" y="972" fill="#FF9F5A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">서버가 막는 것</text>
  <text x="68" y="1014" fill="#E8D8C8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">시퀀스 단조 증가 · 요청 토큰버킷 12/s burst 16</text>
  <text x="68" y="1046" fill="#E8D8C8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">외국 훅 / 내 코스 밖 훅 / 듀얼 로프 없이 두 줄 / 같은 면 두 줄</text>
  <text x="68" y="1078" fill="#E8D8C8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">같은 훅 반복 파밍 (scoredHooks) · 클라 사출 속도가 아닌 부착 중 관측으로 판정</text>
