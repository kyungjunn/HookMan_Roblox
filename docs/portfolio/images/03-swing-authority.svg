  <text x="610" y="156" text-anchor="middle" fill="#FF6BCB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">CLIENT PREDICTION</text>
  <text x="1040" y="156" text-anchor="middle" fill="#6EE7A8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">SERVER AUTHORITY</text>
  <text x="1408" y="156" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">SETTLEMENT</text>

  <rect x="40" y="196" width="300" height="108" rx="16" fill="#1E3A55"/>
  <text x="190" y="242" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="24" font-weight="800">Q / E 탭</text>
  <text x="190" y="276" text-anchor="middle" fill="#A8C4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">홀드 0.18s 이상은 조향</text>

  <rect x="380" y="196" width="460" height="108" rx="16" fill="#3A2448"/>
  <text x="610" y="238" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">후보 훅 선택 → RopeConstraint 생성</text>
  <text x="610" y="274" text-anchor="middle" fill="#D0B4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">길이 88% · 진입속도 보정 · AlignOrientation</text>

  <rect x="880" y="196" width="420" height="108" rx="16" fill="#1E5538"/>
  <text x="1090" y="238" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">HookService.attach</text>
  <text x="1090" y="274" text-anchor="middle" fill="#B8DCC8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">내 코스 훅 · 거리 · 듀얼 로프 조건</text>

  <rect x="1340" y="196" width="220" height="108" rx="16" fill="#3A3418"/>
