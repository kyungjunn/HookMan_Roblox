  <text x="610" y="402" text-anchor="middle" fill="#D0B4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">콤보가 목표속도 상한을 끌어올림</text>

  <rect x="880" y="324" width="420" height="108" rx="16" fill="#1E5538"/>
  <text x="1090" y="366" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">Heartbeat 관측</text>
  <text x="1090" y="402" text-anchor="middle" fill="#B8DCC8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">position / velocity / time 스냅샷</text>

  <rect x="1340" y="324" width="220" height="108" rx="16" fill="#3A3418"/>
  <text x="1450" y="370" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">observation</text>
  <text x="1450" y="402" text-anchor="middle" fill="#C8B878" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="17">클라 임펄스 무시</text>

  <line x1="340" y1="378" x2="380" y2="378" stroke="#5AB4FF" stroke-width="3" marker-end="url(#a3c)"/>
  <line x1="840" y1="378" x2="880" y2="378" stroke="#8AA0BB" stroke-width="3" marker-end="url(#a3)"/>
  <line x1="1300" y1="378" x2="1340" y2="378" stroke="#6EE7A8" stroke-width="3" marker-end="url(#a3g)"/>

  <rect x="40" y="452" width="300" height="128" rx="16" fill="#1E3A55"/>
  <text x="190" y="504" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="24" font-weight="800">Space / RELEASE</text>
  <text x="190" y="542" text-anchor="middle" fill="#A8C4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">목표: 최하점 이후 상승 30°</text>

  <rect x="380" y="452" width="460" height="128" rx="16" fill="#3A2448"/>
  <text x="610" y="496" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">로컬 ReleaseJudge + 사출</text>
  <text x="610" y="528" text-anchor="middle" fill="#D0B4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">speedMul · launchUp · 곡예 각속도</text>
  <text x="610" y="556" text-anchor="middle" fill="#D0B4DC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">플래시/FOV는 즉시. 콤보는 대기.</text>

  <rect x="880" y="452" width="420" height="128" rx="16" fill="#1E5538"/>
  <text x="1090" y="496" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22" font-weight="800">HookService.release</text>
  <text x="1090" y="528" text-anchor="middle" fill="#B8DCC8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">부착시간 0.15–15s · 관측 0.3s 이내</text>
  <text x="1090" y="556" text-anchor="middle" fill="#B8DCC8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">서버 관측으로 재평가. 클라 등급 불신</text>

  <rect x="1340" y="452" width="220" height="128" rx="16" fill="#3A3418"/>
  <text x="1450" y="500" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">PERFECT</text>
  <text x="1450" y="528" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">GREAT / GOOD</text>
  <text x="1450" y="556" text-anchor="middle" fill="#FF8A8A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20" font-weight="800">MISS</text>

