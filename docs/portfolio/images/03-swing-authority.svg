  <rect width="1600" height="1140" fill="url(#bg3)"/>
  <text x="48" y="56" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="36" font-weight="800">스윙 파이프라인  ·  예측과 권한의 분리</text>
  <text x="48" y="94" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22">로프와 비행감은 클라이언트가 즉시 만들고, 콤보·점수는 서버 관측으로만 확정한다.</text>

  <rect x="40" y="122" width="1520" height="52" rx="12" fill="#1A2330"/>
