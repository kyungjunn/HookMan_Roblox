<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1118"/>
      <stop offset="1" stop-color="#151C28"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#5AB4FF"/>
    </marker>
    <marker id="a2g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#6EE7A8"/>
    </marker>
    <marker id="a2o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#FF9F5A"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="48" y="58" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="36" font-weight="800">런 생명주기  ·  서버가 유일한 전이 소유자</text>
  <text x="48" y="96" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22">HookmanStage만 상태를 바꾼다. 클라이언트는 HookmanRun 패킷을 받아 따라간다.</text>

  <rect x="40" y="132" width="268" height="128" rx="20" fill="#1E3A55" stroke="#5AB4FF" stroke-width="3"/>
  <text x="174" y="186" text-anchor="middle" fill="#5AB4FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="30" font-weight="800">Lobby</text>
  <text x="174" y="222" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">상점 · 장착 · 존 패드</text>

  <rect x="348" y="132" width="268" height="128" rx="20" fill="#3A2448" stroke="#FF6BCB" stroke-width="3"/>
  <text x="482" y="186" text-anchor="middle" fill="#FF6BCB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="28" font-weight="800">Preparing</text>
  <text x="482" y="222" text-anchor="middle" fill="#E0C8EA" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">코스 슬롯 할당 · 효과 동결</text>

  <rect x="656" y="132" width="268" height="128" rx="20" fill="#1E5538" stroke="#6EE7A8" stroke-width="3"/>
  <text x="790" y="186" text-anchor="middle" fill="#6EE7A8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="30" font-weight="800">Running</text>
  <text x="790" y="222" text-anchor="middle" fill="#C5EBD4" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">훅 · 판정 · 장애물 · 골</text>

  <rect x="964" y="132" width="268" height="128" rx="20" fill="#553818" stroke="#FFD640" stroke-width="3"/>
  <text x="1098" y="186" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="30" font-weight="800">Settling</text>
  <text x="1098" y="222" text-anchor="middle" fill="#F0E0B0" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">클리어 보너스 · 코인 정산</text>

  <rect x="1272" y="132" width="288" height="128" rx="20" fill="#3A2A18" stroke="#FF9F5A" stroke-width="3"/>
  <text x="1416" y="186" text-anchor="middle" fill="#FF9F5A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="30" font-weight="800">Returning</text>
  <text x="1416" y="222" text-anchor="middle" fill="#F0D0B8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">코스 해제 · 로비 텔레포트</text>

  <line x1="308" y1="196" x2="348" y2="196" stroke="#5AB4FF" stroke-width="4" marker-end="url(#a2)"/>
  <line x1="616" y1="196" x2="656" y2="196" stroke="#FF6BCB" stroke-width="4" marker-end="url(#a2)"/>
  <line x1="924" y1="196" x2="964" y2="196" stroke="#6EE7A8" stroke-width="4" marker-end="url(#a2g)"/>
  <line x1="1232" y1="196" x2="1272" y2="196" stroke="#FFD640" stroke-width="4" marker-end="url(#a2)"/>
  <path d="M1416 260 L1416 318 L174 318 L174 260" fill="none" stroke="#FF9F5A" stroke-width="3" marker-end="url(#a2o)"/>
  <text x="430" y="308" fill="#FF9F5A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18" font-weight="700">endRun · 로비 복귀</text>

  <rect x="656" y="360" width="268" height="100" rx="18" fill="#2A1818" stroke="#FF6B6B" stroke-width="3"/>
  <text x="790" y="404" text-anchor="middle" fill="#FF8A8A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">Resetting</text>
  <text x="790" y="436" text-anchor="middle" fill="#E8C0C0" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">체크포인트 리스폰</text>
  <path d="M720 260 L720 360" fill="none" stroke="#FF8A8A" stroke-width="3" marker-end="url(#a2o)"/>
  <path d="M860 360 L860 260" fill="none" stroke="#6EE7A8" stroke-width="3" marker-end="url(#a2g)"/>
  <text x="944" y="416" fill="#FF8A8A" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18" font-weight="700">낙사 · 코스이탈 · 텔레포트 의심</text>

  <rect x="40" y="492" width="740" height="372" rx="22" fill="#17202C" stroke="#2E4A66" stroke-width="2"/>
  <text x="68" y="540" fill="#5AB4FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">시작 조건  (ZonePad Touched)</text>
  <text x="68" y="586" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">1. Economy.isReady  — 프로필 리스 확보</text>
  <text x="68" y="622" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">2. 로비 스폰 180스터드 안 — 코스에서 재시작 금지</text>
  <text x="68" y="658" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">3. ZoneCatalog.unlocked(lifetimeScore) — 해금된 존만</text>
  <text x="68" y="694" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">4. Economy.beginRun — 활성 런 1개 잠금</text>
  <text x="68" y="730" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">5. ShopCatalog.effectOf(equipped) freeze — 런 중 장착 변경 무효</text>
  <text x="68" y="766" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">6. CourseService.acquire — 개인 코스 슬롯. 실패 시 즉시 endRun</text>
  <text x="68" y="814" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">플레이어끼리 충돌 없음 (CollisionGroup). 코스는 12,000스터드 간격.</text>

  <rect x="804" y="492" width="756" height="372" rx="22" fill="#17241C" stroke="#2E6648" stroke-width="2"/>
  <text x="832" y="540" fill="#6EE7A8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">Running Heartbeat</text>
  <text x="832" y="586" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">이동 샘플 검증  validMovement (속도·간격·유한값)</text>
  <text x="832" y="622" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">코스 반경 / FailPlane / 고도 이탈 → Resetting</text>
  <text x="832" y="658" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">체크포인트 평면 교차  crossedPlane (역주행 거부)</text>
  <text x="832" y="694" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">장애물 세그먼트–AABB  segmentBox + 콤보리셋 + 감점</text>
  <text x="832" y="730" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">관측 스냅샷 저장 → 릴리즈 판정의 유일한 입력</text>
  <text x="832" y="766" fill="#D7E4F5" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">골 면 통과 + 체크포인트 완료 → Settling</text>
  <text x="832" y="814" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">사망 / 캐릭터 제거 / R 포기 / 900초 타임아웃 → endRun. 중도 포기는 코인 없음.</text>
</svg>
