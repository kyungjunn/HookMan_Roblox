<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1118"/>
      <stop offset="1" stop-color="#151C28"/>
    </linearGradient>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#FFD640"/>
    </marker>
    <marker id="a4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#5AB4FF"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#6EE7A8"/>
    </marker>
    <marker id="a4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#FF6BCB"/>
    </marker>
  </defs>
  <rect width="1600" height="960" fill="url(#bg4)"/>
  <text x="48" y="56" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="36" font-weight="800">성장 루프  ·  두 축을 섞지 않는다</text>
  <text x="48" y="94" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="22">점수는 영구 진행, 코인은 소모 구매. 한 자원이 두 문을 열면 루프가 서로를 잡아먹는다.</text>

  <rect x="560" y="128" width="480" height="156" rx="22" fill="#1E5538" stroke="#6EE7A8" stroke-width="3"/>
  <text x="800" y="188" text-anchor="middle" fill="#6EE7A8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="32" font-weight="800">RUN 클리어</text>
  <text x="800" y="226" text-anchor="middle" fill="#C5EBD4" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">RewardRules.finish(score, level, zone)</text>
  <text x="800" y="256" text-anchor="middle" fill="#C5EBD4" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">클리어 보너스 × 존 점수배수</text>

  <rect x="40" y="360" width="480" height="220" rx="22" fill="#3A2A10" stroke="#FFD640" stroke-width="3"/>
  <text x="280" y="410" text-anchor="middle" fill="#FFD640" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="28" font-weight="800">COINS  소모축</text>
  <text x="280" y="452" text-anchor="middle" fill="#F0E0B0" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">total / scoreMul × coinMul × 0.05</text>
  <text x="280" y="484" text-anchor="middle" fill="#F0E0B0" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">사면 사라진다. 존 해금에 쓰지 않음.</text>
  <text x="280" y="528" text-anchor="middle" fill="#C8B878" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="19">다운타운 약 90코인/런 · 상점 합계 19,700</text>
  <text x="280" y="556" text-anchor="middle" fill="#C8B878" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="19">상위 존 coinMul은 완만 (최대 1.6×)</text>

  <rect x="560" y="360" width="480" height="220" rx="22" fill="#1E3A55" stroke="#5AB4FF" stroke-width="3"/>
  <text x="800" y="410" text-anchor="middle" fill="#5AB4FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">LIFETIME SCORE  진행축</text>
  <text x="800" y="452" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">절대 줄지 않는 누적 점수</text>
  <text x="800" y="484" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">존 해금의 유일한 열쇠</text>
  <text x="800" y="528" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="19">20k / 110k / 450k / 1.4M</text>
  <text x="800" y="556" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="19">상위 존 scoreMul은 가파름 (최대 3.2×)</text>

  <rect x="1080" y="360" width="480" height="220" rx="22" fill="#3A2448" stroke="#FF6BCB" stroke-width="3"/>
  <text x="1320" y="410" text-anchor="middle" fill="#FF6BCB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">BEST SCORE  경쟁축</text>
  <text x="1320" y="452" text-anchor="middle" fill="#E0C8EA" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">개인 최고점만 OrderedDataStore</text>
  <text x="1320" y="484" text-anchor="middle" fill="#E0C8EA" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">누적이면 출석 랭킹이 된다</text>
  <text x="1320" y="528" text-anchor="middle" fill="#C9A8D4" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="19">글로벌 Top10 + 이 서버 Top5</text>
  <text x="1320" y="556" text-anchor="middle" fill="#C9A8D4" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="19">밸런스 깨지면 v2 키로 리셋</text>

  <line x1="640" y1="284" x2="280" y2="360" stroke="#FFD640" stroke-width="3" marker-end="url(#a4)"/>
  <line x1="800" y1="284" x2="800" y2="360" stroke="#5AB4FF" stroke-width="3" marker-end="url(#a4c)"/>
  <line x1="960" y1="284" x2="1320" y2="360" stroke="#FF6BCB" stroke-width="3" marker-end="url(#a4p)"/>

  <rect x="40" y="620" width="480" height="270" rx="22" fill="#17202C" stroke="#3A5A78" stroke-width="2"/>
  <text x="280" y="668" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">상점 3슬롯</text>
  <text x="280" y="712" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">HOOK  로프 스킨 + 점수 소폭</text>
  <text x="280" y="744" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">AURA  가속 · PERFECT 특화</text>
  <text x="280" y="776" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">ABILITY  듀얼 로프 (조작 확장)</text>
  <text x="280" y="820" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">배수는 곱, 속도상한은 합, dualRope는 OR</text>
  <text x="280" y="850" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">능력은 천장 없는 장기 목표</text>

  <rect x="560" y="620" width="480" height="270" rx="22" fill="#17202C" stroke="#3A5A78" stroke-width="2"/>
  <text x="800" y="668" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">존 5곳</text>
  <text x="800" y="712" text-anchor="middle" fill="#5AB4FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">다운타운 → 선셋 하버 → 네온 시티</text>
  <text x="800" y="744" text-anchor="middle" fill="#5AB4FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">→ 글레이셔 → 러스트 웨이스트</text>
  <text x="800" y="784" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">시작 레벨 · 장애물 · 팔레트 고정</text>
  <text x="800" y="816" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">클리어마다 존 레벨 +1, 상한까지</text>
  <text x="800" y="850" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">어려운 곳이 곧 파밍 효율</text>

  <rect x="1080" y="620" width="480" height="270" rx="22" fill="#17202C" stroke="#3A5A78" stroke-width="2"/>
  <text x="1320" y="668" text-anchor="middle" fill="#E8F1FF" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="26" font-weight="800">로비 랭킹 보드</text>
  <text x="1320" y="712" text-anchor="middle" fill="#E0C8EA" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">서버 SurfaceGui 복제</text>
  <text x="1320" y="744" text-anchor="middle" fill="#E0C8EA" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">클라 랭킹 스크립트 없음</text>
  <text x="1320" y="776" text-anchor="middle" fill="#C5D8EC" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="20">빈 칸은 --- 유지 (길이 고정)</text>
  <text x="1320" y="820" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">랭킹 장애는 warn, 게임은 계속</text>
  <text x="1320" y="850" text-anchor="middle" fill="#8AA0BB" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">Economy → Leaderboard 단방향</text>

  <line x1="280" y1="580" x2="280" y2="620" stroke="#FFD640" stroke-width="3" marker-end="url(#a4)"/>
  <line x1="800" y1="580" x2="800" y2="620" stroke="#5AB4FF" stroke-width="3" marker-end="url(#a4c)"/>
  <line x1="1320" y1="580" x2="1320" y2="620" stroke="#FF6BCB" stroke-width="3" marker-end="url(#a4p)"/>

  <path d="M280 890 L280 922 L800 922 L800 284" fill="none" stroke="#6EE7A8" stroke-width="2.5" marker-end="url(#a4g)"/>
  <text x="430" y="948" fill="#6EE7A8" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif" font-size="18">장착 효과는 다음 런 시작 때 freeze. 런 도중 상점 잠금.</text>
</svg>
